<div class="min-h-screen bg-slate-50 flex items-center justify-center p-4 page-transition-enter">

  <div class="w-full max-w-md bg-white p-8 sm:p-10 rounded-2xl shadow-xl border border-slate-100">

    <div class="flex justify-center mb-2 -mt-4">
      <app-logo-xml-flow></app-logo-xml-flow>
    </div>

    <h1 class="text-3xl font-bold text-center text-slate-900 mb-2">
      Iniciar Sesión
    </h1>
    <p class="text-center text-sm text-slate-500 mb-8">
      Ingresa tus credenciales para acceder a Vexel
    </p>

    @if (mensajeError()) {
      <div
        id="login-error-alert"
        role="alert"
        aria-live="assertive"
        class="animate-alert-in mb-6 p-3.5 rounded-xl bg-red-50 border border-red-200 text-red-700 flex items-start gap-3 shadow-xs">
        <svg class="w-5 h-5 text-red-600 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 9v2m0 4h.01M5.07 19h13.86c1.54 0 2.5-1.67 1.73-3L13.73 4c-.77-1.33-2.69-1.33-3.46 0L3.34 16c-.77 1.33.19 3 1.73 3z">
          </path>
        </svg>
        <span class="text-sm font-medium leading-snug">
          {{ mensajeError() }}
        </span>
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5" novalidate>

      <div>
        <label for="usuario" class="block text-sm font-semibold text-slate-700 mb-2">
          Usuario
        </label>
        <input
          id="usuario"
          name="username"
          type="text"
          formControlName="usuario"
          (input)="limpiarErrorAlEscribir()"
          placeholder="Ingresa tu usuario (ej. daniela o admin)"
          autocomplete="username"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          enterkeyhint="next"
          required
          [attr.aria-invalid]="!!mensajeError()"
          [attr.aria-describedby]="mensajeError() ? 'login-error-alert' : null"
          class="w-full px-4 py-3 text-base border rounded-xl outline-none transition duration-150"
          [ngClass]="mensajeError() ? 'border-red-300 bg-red-50/30 focus:ring-2 focus:ring-red-100 focus:border-red-400' : 'border-slate-200 bg-white focus:ring-2 focus:ring-blue-100 focus:border-blue-500'">
      </div>

      <div>
        <label for="password" class="block text-sm font-semibold text-slate-700 mb-2">
          Contraseña
        </label>
        <div class="relative">
          <input
            id="password"
            name="password"
            [type]="mostrarPassword() ? 'text' : 'password'"
            formControlName="password"
            (input)="limpiarErrorAlEscribir()"
            placeholder="••••••••"
            autocomplete="current-password"
            enterkeyhint="done"
            required
            [attr.aria-invalid]="!!mensajeError()"
            [attr.aria-describedby]="mensajeError() ? 'login-error-alert' : null"
            class="w-full pl-4 pr-12 py-3 text-base border rounded-xl outline-none transition duration-150"
            [ngClass]="mensajeError() ? 'border-red-300 bg-red-50/30 focus:ring-2 focus:ring-red-100 focus:border-red-400' : 'border-slate-200 bg-white focus:ring-2 focus:ring-blue-100 focus:border-blue-500'">

          <button
            type="button"
            (click)="toggleMostrarPassword()"
            [attr.aria-pressed]="mostrarPassword()"
            [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [title]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            class="absolute inset-y-0 right-0 w-12 flex items-center justify-center text-slate-400 hover:text-blue-600 focus:outline-none focus-visible:text-blue-600 rounded-r-xl transition cursor-pointer">
            @if (mostrarPassword()) {
              <!-- Ojo tachado (Ocultar contraseña) -->
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21">
                </path>
              </svg>
            } @else {
              <!-- Ojo abierto (Mostrar contraseña) -->
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z">
                </path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                </path>
              </svg>
            }
          </button>
        </div>
      </div>

      <div class="pt-1">
        <button
          type="submit"
          [disabled]="cargando()"
          class="w-full flex items-center justify-center gap-2.5 py-3.5 px-5 border border-transparent rounded-xl shadow-sm text-base font-semibold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-65 disabled:cursor-not-allowed transition duration-150 cursor-pointer">
          @if (cargando()) {
            <span class="btn-inline-spinner" aria-hidden="true"></span>
            <span>Verificando credenciales...</span>
          } @else {
            <span>Acceder al Panel</span>
          }
        </button>
      </div>

    </form>

    <div class="text-center text-sm text-slate-500 mt-7 pt-6 border-t -mb-2 border-slate-100">
      Vexel © 2026
    </div>

  </div>
</div>
