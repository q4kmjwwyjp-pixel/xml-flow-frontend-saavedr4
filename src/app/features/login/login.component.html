<div class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
  
  <div class="w-full max-w-md bg-white p-10 rounded-2xl shadow-xl border border-slate-100">
    
    <div class="flex justify-center mb-2 -mt-5">
      <app-logo-xml-flow></app-logo-xml-flow>
    </div>


    <h2 class="text-3xl font-bold text-center text-slate-900 mb-10">
      Iniciar Sesión
    </h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
      
      <div>
        <label for="email" class="block text-sm font-medium text-slate-700 mb-2">
          Correo electrónico
        </label>
        <input id="email" type="email" formControlName="email" placeholder="tu@correo.com" class="w-full px-4 py-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-100 focus:border-blue-400 outline-none transition duration-150">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 mb-2">
          Contraseña
        </label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••" class="w-full px-4 py-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-100 focus:border-blue-400 outline-none transition duration-150">
      </div>

      <div>
        <button type="submit" [disabled]="loginForm.invalid" class="w-full flex justify-center py-3.5 px-5 border border-transparent rounded-lg shadow-sm text-base font-semibold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed transition duration-150">
          Acceder al Panel
        </button>
      </div>

    </form>

    <div class="text-center text-sm text-slate-500 mt-7 pt-6 border-t -mb-2 border-slate-100">
      XmlFlow © 2026
    </div>

  </div>
</div>
