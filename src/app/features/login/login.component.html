<div class="min-h-screen bg-slate-50 flex items-center justify-center p-4 sm:p-6 page-transition-enter">

  <div class="w-full max-w-sm bg-white p-7 sm:p-8 rounded-2xl shadow-xs border border-slate-200/80">

    <div class="flex justify-center mb-4">
      <app-logo-xml-flow></app-logo-xml-flow>
    </div>

    <div class="text-center mb-6">
      <h1 class="text-xl font-bold text-slate-900 tracking-tight">
        Iniciar Sesión
      </h1>
      <p class="text-xs text-slate-500 mt-1">
        Ingresa tus credenciales para acceder a VEXEL
      </p>
    </div>

    @if (mensajeError()) {
      <div
        id="login-error-alert"
        role="alert"
        aria-live="assertive"
        class="animate-alert-in mb-5 p-3 rounded-lg bg-rose-50 border border-rose-200/80 text-rose-800 flex items-start gap-2.5">
        <svg class="w-4 h-4 text-rose-600 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke-width="2"/>
          <line x1="12" y1="8" x2="12" y2="12" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="16" r="0.5" fill="currentColor"/>
        </svg>
        <span class="text-xs font-medium leading-relaxed">
          {{ mensajeError() }}
        </span>
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4" novalidate>

      <div>
        <label for="usuario" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
          Usuario
        </label>
        <input
          id="usuario"
          name="username"
          type="text"
          formControlName="usuario"
          (input)="limpiarErrorAlEscribir()"
          placeholder="daniela o admin"
          autocomplete="username"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          enterkeyhint="next"
          required
          [attr.aria-invalid]="!!mensajeError()"
          [attr.aria-describedby]="mensajeError() ? 'login-error-alert' : null"
          class="w-full px-3.5 py-2.5 text-sm border rounded-lg outline-none transition duration-150"
          [ngClass]="mensajeError() ? 'border-rose-300 bg-rose-50/20 focus:border-rose-500' : 'border-slate-300 bg-white hover:border-slate-400 focus:border-slate-900 focus:ring-1 focus:ring-slate-900'">
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
          Contraseña
        </label>
        <div class="relative">
          <input
            id="password"
            name="password"
            [type]="mostrarPassword() ? 'text' : 'password'"
            formControlName="password"
            (input)="limpiarErrorAlEscribir()"
            placeholder="••••••••"
            autocomplete="current-password"
            enterkeyhint="done"
            required
            [attr.aria-invalid]="!!mensajeError()"
            [attr.aria-describedby]="mensajeError() ? 'login-error-alert' : null"
            class="w-full pl-3.5 pr-10 py-2.5 text-sm border rounded-lg outline-none transition duration-150"
            [ngClass]="mensajeError() ? 'border-rose-300 bg-rose-50/20 focus:border-rose-500' : 'border-slate-300 bg-white hover:border-slate-400 focus:border-slate-900 focus:ring-1 focus:ring-slate-900'">

          <button
            type="button"
            (click)="toggleMostrarPassword()"
            [attr.aria-pressed]="mostrarPassword()"
            [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            class="absolute inset-y-0 right-0 w-10 flex items-center justify-center text-slate-400 hover:text-slate-700 rounded-r-lg transition cursor-pointer">
            @if (mostrarPassword()) {
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21">
                </path>
              </svg>
            } @else {
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z">
                </path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                </path>
              </svg>
            }
          </button>
        </div>
      </div>

      <div class="pt-2">
        <button
          type="submit"
          [disabled]="cargando()"
          class="w-full flex items-center justify-center gap-2 py-2.5 px-4 rounded-lg text-sm font-semibold text-white bg-slate-900 hover:bg-slate-800 active:bg-slate-950 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-900 disabled:opacity-50 disabled:cursor-not-allowed transition duration-150 cursor-pointer shadow-xs">
          @if (cargando()) {
            <span class="btn-inline-spinner" aria-hidden="true"></span>
            <span>Verificando...</span>
          } @else {
            <span>Acceder al Panel</span>
          }
        </button>
      </div>

    </form>

    <div class="text-center text-[11px] text-slate-400 mt-6 pt-4 border-t border-slate-100">
      VEXEL &bull; CFDI 4.0
    </div>

  </div>
</div>
