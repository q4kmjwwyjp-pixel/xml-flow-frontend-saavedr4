<div class="min-h-screen bg-slate-50 flex items-center justify-center p-4 page-transition-enter">
  <div class="w-full max-w-md bg-white p-8 sm:p-10 rounded-2xl shadow-xl border border-slate-100">

    <!-- Botón de regreso integrado en el encabezado de la tarjeta (sin flotar con position: fixed) -->
    <div class="mb-4 -mt-2">
      <button
        type="button"
        title="Regresar al Dashboard"
        (click)="regresar()"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-slate-600 hover:text-blue-600 bg-slate-100 hover:bg-blue-50 rounded-lg transition cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        Regresar al Dashboard
      </button>
    </div>

    <!-- Logo idéntico al de Login -->
    <div class="flex justify-center mb-2 -mt-2">
      <app-logo-xml-flow></app-logo-xml-flow>
    </div>

    <h1 class="text-3xl font-bold text-center text-slate-900 mb-8">
      Cargar Factura XML
    </h1>

    <!-- Zona Drag and Drop -->
    <div 
      class="w-full border-2 border-dashed rounded-xl p-6 text-center transition-all duration-150 mb-6"
      [ngClass]="estaArrastrando() ? 'border-blue-500 bg-blue-50/50' : 'border-slate-200 bg-slate-50/50 hover:border-slate-300'"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)">

      @if (archivoSeleccionado()) {
        <p class="text-sm font-semibold text-slate-800 break-all mb-1">
          {{ archivoSeleccionado()?.name }}
        </p>
        <button type="button" class="text-xs text-red-500 font-medium hover:underline cursor-pointer" (click)="limpiarArchivo()">
          Cambiar archivo
        </button>
      } @else {
        <p class="text-sm text-slate-500 mb-1">Arrastra tu archivo XML aquí o</p>
        <label for="fileInput" class="text-sm font-semibold text-blue-600 hover:text-blue-700 cursor-pointer">
          Explorar archivos
        </label>
        <input id="fileInput" type="file" accept=".xml, application/xml, text/xml" class="hidden" (change)="onFileSelected($event)" />
      }
    </div>

    <!-- Alerta de Error -->
    @if (mensajeError()) {
      <div role="alert" class="animate-alert-in p-3 mb-6 bg-red-50 text-red-700 text-xs rounded-lg text-center border border-red-200">
        {{ mensajeError() }}
      </div>
    }

    <!-- Botón de Envío estilo Login -->
    <button 
      type="button" 
      [disabled]="!archivoSeleccionado() || cargando()"
      (click)="enviarArchivo()"
      class="w-full flex items-center justify-center gap-2.5 py-3.5 px-5 border border-transparent rounded-lg shadow-sm text-base font-semibold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed transition duration-150 cursor-pointer">
      @if (cargando()) {
        <span class="btn-inline-spinner" aria-hidden="true"></span>
        <span>Validando comprobante XML...</span>
      } @else {
        <span>Enviar XML</span>
      }
    </button>

    <!-- Footer estilo Login -->
    <div class="text-center text-sm text-slate-500 mt-7 pt-6 border-t -mb-2 border-slate-100">
      VEXEL © 2026
    </div>

  </div>
</div>
