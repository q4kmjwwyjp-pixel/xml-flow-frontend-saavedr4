name: Build Android APK

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Debug (Capacitor Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependencias de NPM
        run: npm install

      - name: Compilar aplicación Angular
        run: npm run build

      - name: Sincronizar Capacitor con proyecto Android
        run: npx cap sync android

      - name: Dar permisos de ejecución a Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK Debug con Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir artefacto APK listo para instalar
        uses: actions/upload-artifact@v4
        with:
          name: XmlFlow-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
