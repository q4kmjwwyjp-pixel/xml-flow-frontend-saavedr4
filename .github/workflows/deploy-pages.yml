name: Desplegar Frontend en GitHub Pages (100% Gratis)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Compilar Angular + PWA para GitHub Pages
        run: |
          npx ng build --base-href /xml-flow-frontend-saavedr4/
          cp dist/XmlFlow/browser/index.html dist/XmlFlow/browser/404.html
          touch dist/XmlFlow/browser/.nojekyll

      - name: Publicar en rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/XmlFlow/browser
